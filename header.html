<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuickWash Header</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}body{margin:0;padding:12px 14px;font-family:'Poppins',system-ui,sans-serif;color:#e6f7ff;background:transparent}h2{margin:0;font-size:1.4rem;font-weight:700;color:#7dd3fc}.sub{margin:2px 0 14px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.25);font-size:.82rem}a{color:#22d3ee;font-weight:600}:focus-visible{outline:2px solid #22d3ee;outline-offset:2px}body{text-align:center;padding:16px 10px}h1{margin:0;font-size:clamp(1.4rem,5vw,2.6rem);font-weight:800;letter-spacing:.04em;color:#fff;text-shadow:0 0 22px rgba(125,211,252,.8)}h1 span{color:#7dd3fc}.tag{display:inline-block;margin-top:8px;padding:5px 18px;border-radius:99px;background:rgba(0,40,80,.35);border:1px solid rgba(255,255,255,.25);font-size:.72rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase}</style>
</head>
<body>
<!-- HEADER: shop name and slogan -->
<h1>🫧 QUICK<span>WASH</span> LAUNDRY SHOP 🫧</h1>
<div class="tag">Fast, clean, and reliable laundry services</div>
