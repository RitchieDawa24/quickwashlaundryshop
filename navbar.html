<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuickWash Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}body{margin:0;padding:12px 14px;font-family:'Poppins',system-ui,sans-serif;color:#e6f7ff;background:transparent}h2{margin:0;font-size:1.4rem;font-weight:700;color:#7dd3fc}.sub{margin:2px 0 14px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.25);font-size:.82rem}a{color:#22d3ee;font-weight:600}:focus-visible{outline:2px solid #22d3ee;outline-offset:2px}h2{font-size:1.1rem}small{display:block;margin:2px 0 12px;font-size:.7rem;opacity:.75;border-bottom:1px solid rgba(255,255,255,.25);padding-bottom:10px}nav{display:grid;gap:6px}nav a{display:block;padding:11px 12px;border-radius:12px;color:#e6f7ff;text-decoration:none;font-size:.85rem}nav a:hover{background:rgba(255,255,255,.12)}nav a.on{background:rgba(255,255,255,.28);box-shadow:inset 3px 0 0 #22d3ee}.open{margin-top:18px;padding:10px;border-radius:12px;background:rgba(0,40,80,.35);border:1px solid rgba(255,255,255,.25);font-size:.72rem;text-align:center}.open b{color:#4ade80;display:block}@media(min-width:300px){nav{grid-template-columns:repeat(4,1fr)}nav a{text-align:center;padding:9px 2px;font-size:.7rem}.open{margin-top:10px}}</style>
</head>
<body>
<!-- NAVBAR: links open inside the "content" frame -->
<h2>☰ MENU</h2><small>Navigation Bar</small>
<nav>
  <a href="home.html" target="content" class="on">🏠 HOME</a>
  <a href="services.html" target="content">🧺 SERVICES</a>
  <a href="booking.html" target="content">📅 BOOKING</a>
  <a href="contacts.html" target="content">📇 CONTACTS</a>
</nav>
<div class="open"><b>● Shop Open 24/7</b>Mon – Sun: Open 24 Hours</div>
<script>document.querySelectorAll('nav a').forEach(function(a){a.onclick=function(){document.querySelectorAll('nav a').forEach(function(x){x.classList.remove('on')});a.classList.add('on')}})</script>
</body>
</html>
