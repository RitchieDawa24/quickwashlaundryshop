<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuickWash Contacts</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}body{margin:0;padding:12px 14px;font-family:'Poppins',system-ui,sans-serif;color:#e6f7ff;background:transparent}h2{margin:0;font-size:1.4rem;font-weight:700;color:#7dd3fc}.sub{margin:2px 0 14px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.25);font-size:.82rem}a{color:#22d3ee;font-weight:600}:focus-visible{outline:2px solid #22d3ee;outline-offset:2px}label{display:block;margin-bottom:4px;font-size:.72rem;font-weight:600;color:#7dd3fc}input,select,textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(3,31,58,.6);color:#fff;font:500 .9rem 'Poppins',sans-serif}input::placeholder,textarea::placeholder{color:rgba(230,247,255,.45)}textarea{min-height:86px;resize:vertical}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f{grid-column:1/-1}.btn{margin-top:14px;width:100%;padding:13px;border:0;border-radius:12px;background:linear-gradient(90deg,#22d3ee,#2563eb);color:#021526;font:700 .95rem 'Poppins',sans-serif;cursor:pointer}.btn:hover{filter:brightness(1.1)}.ok{display:none;margin-top:14px;padding:14px;border-radius:14px;background:rgba(74,222,128,.15);border:1px solid rgba(74,222,128,.5);font-size:.85rem}@media(max-width:560px){.g{grid-template-columns:1fr}}.info{display:grid;gap:8px;margin-bottom:12px}.info div{padding:9px 14px;border-radius:12px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);font-size:.85rem}h3{margin:14px 0 6px;font-size:1.05rem;color:#7dd3fc}</style>
</head>
<body>
<h2>📇 Contact Us</h2>
<div class="sub">Reach us anytime, we're open 24/7.</div>
<div class="info">
  <div>📍 <b>Address:</b> Alang-Alang, Mandaue City</div>
  <div>📞 <b>Hotline:</b> <a href="tel:09129978036">09129978036</a></div>
  <div>✉️ <b>Email:</b> <a href="mailto:ritchiedawa24@gmail.com">ritchiedawa24@gmail.com</a></div>
  <div>🕒 <b>Hours:</b> Open 24 hours, Monday to Sunday</div>
</div>
<h3>💬 Share your feedback</h3>
<form id="ff">
  <div class="g">
    <div><label for="fn">Your Name (optional)</label><input id="fn" placeholder="Juan Dela Cruz"></div>
    <div><label for="fr">Rating</label><select id="fr"><option>⭐⭐⭐⭐⭐ Excellent</option><option>⭐⭐⭐⭐ Good</option><option>⭐⭐⭐ Okay</option><option>⭐⭐ Needs work</option><option>⭐ Poor</option></select></div>
    <div class="f"><label for="fm">How was our service? How can we improve?</label><textarea id="fm" required placeholder="Write your feedback here…"></textarea></div>
  </div>
  <button class="btn" type="submit">Send Feedback</button>
</form>
<div class="ok" id="ok"></div>
<script>
var $=function(i){return document.getElementById(i)};
$('ff').onsubmit=function(e){
  e.preventDefault();
  var n=$('fn').value.trim()||'Anonymous',r=$('fr').value,m=$('fm').value.trim();
  var body='Customer feedback\nFrom: '+n+'\nRating: '+r+'\n\n'+m;
  var box=$('ok');
  box.innerHTML='💙 <b>Thank you for your feedback!</b><br>It helps us make QuickWash better.<br><br>To send it to the shop owner: <a target="_blank" href="mailto:ritchiedawa24@gmail.com?subject=QuickWash%20Feedback&body='+encodeURIComponent(body)+'">email your feedback</a>.';
  box.style.display='block'; e.target.reset();
};
</script>
</body>
</html>
